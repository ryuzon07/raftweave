apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dbgate-pvc
  namespace: raftweave
  labels:
    app: dbgate
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbgate
  namespace: raftweave
  labels:
    app: dbgate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dbgate
  template:
    metadata:
      labels:
        app: dbgate
    spec:
      securityContext:
        fsGroup: 1000 # Ensures the mounted volume has correct permissions for the non-root user
      containers:
      - name: dbgate
        image: dbgate/dbgate:latest
        securityContext:
          runAsUser: 1000 # Run as non-root user
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        ports:
        - containerPort: 3000
        env:
        # DBGate configuration
        - name: LOG_LEVEL
          value: "info"
        - name: THEME
          value: "dark" # Enforces the aesthetic dark theme
        
        # We need a custom home directory for the non-root user 
        # so it doesn't try to write to /root
        - name: HOME
          value: "/home/dbgate"
          
        # Fetching credentials securely from existing RaftWeave secret
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: raftweave-postgres
              key: user
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: raftweave-postgres
              key: password
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: raftweave-postgres
              key: host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: raftweave-postgres
              key: port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: raftweave-postgres
              key: dbname
              
        # Auto-configure read-only connection to RaftWeave Postgres
        - name: CONNECTIONS
          value: "raftweave"
        - name: ENGINE_raftweave
          value: "postgres@dbgate-plugin-postgres"
        - name: LABEL_raftweave
          value: "RaftWeave Prod (RO)"
        - name: SERVER_raftweave
          value: "$(DB_HOST)"
        - name: PORT_raftweave
          value: "$(DB_PORT)"
        - name: USER_raftweave
          value: "$(DB_USER)"
        - name: PASSWORD_raftweave
          value: "$(DB_PASS)"
        - name: DATABASE_raftweave
          value: "$(DB_NAME)"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: dbgate-data
          mountPath: /home/dbgate/.dbgate # Modified from /root/.dbgate for non-root execution
      volumes:
      - name: dbgate-data
        persistentVolumeClaim:
          claimName: dbgate-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: dbgate-service
  namespace: raftweave
  labels:
    app: dbgate
spec:
  selector:
    app: dbgate
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dbgate-ingress
  namespace: raftweave
  labels:
    app: dbgate
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Optional: Basic Auth or IP Whitelisting is highly recommended here!
    # nginx.ingress.kubernetes.io/auth-type: basic
    # nginx.ingress.kubernetes.io/auth-secret: basic-auth
spec:
  tls:
  - hosts:
    - db.raftweave.io
    secretName: dbgate-tls
  rules:
  - host: db.raftweave.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dbgate-service
            port:
              number: 80
